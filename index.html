
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Ascendant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:14px;background:#12182b;color:#9d8cff}
h1{margin:4px;font-size:27px}
#stats{display:flex;justify-content:space-around;padding:12px;font-weight:bold}
canvas{display:block;width:100%;max-width:700px;margin:auto;background:#10152b;border-top:2px solid #765cff;border-bottom:2px solid #765cff;touch-action:manipulation}
.controls{display:flex;justify-content:center;gap:12px;padding:18px;flex-wrap:wrap}
button{background:#563be8;color:white;border:0;border-radius:12px;padding:16px 23px;font-size:17px;font-weight:bold}
#message{min-height:24px;color:#c5baff}
</style>
</head>
<body>
<header>
<h1>SHADOW ASCENDANT</h1>
<div>ARISE, SHADOW HUNTER</div>
</header>
<div id="stats">
<span>❤️ HP: <b id="hp">100</b></span>
<span>⚔️ Kills: <b id="kills">0</b></span>
<span>👾 Wave: <b id="wave">1</b></span>
</div>
<canvas id="game" width="700" height="400"></canvas>
<div id="message">Defeat the shadows to survive!</div>
<div class="controls">
<button id="left">◀ LEFT</button>
<button id="attack">⚔ ATTACK</button>
<button id="right">RIGHT ▶</button>
</div>
<div class="controls">
<button id="restart">↻ RESTART</button>
</div>
<script>
const c=document.getElementById('game');
const ctx=c.getContext('2d');
const hpText=document.getElementById('hp');
const killsText=document.getElementById('kills');
const waveText=document.getElementById('wave');
const msg=document.getElementById('message');
let hero,enemies,kills,wave,frame,gameOver,attacking;
function reset(){
 hero={x:350,y:315,hp:100};
 enemies=[];kills=0;wave=1;frame=0;
 gameOver=false;attacking=0;
 msg.textContent='Defeat the shadows to survive!';
 updateStats();
}
function updateStats(){
 hpText.textContent=hero.hp;
 killsText.textContent=kills;
 waveText.textContent=wave;
}
function spawn(){
 enemies.push({x:40+Math.random()*620,hp:2,attack:0});
}
function move(d){if(!gameOver)hero.x=Math.max(25,Math.min(675,hero.x+d))}
function attack(){
 if(gameOver)return;
 attacking=12;
 let hit=false;
 enemies.forEach(e=>{
 if(Math.abs(e.x-hero.x)<105){e.hp--;hit=true}
 });
 enemies=enemies.filter(e=>{
 if(e.hp<=0){kills++;return false}return true
 });
 if(hit)msg.textContent='Shadow struck! Keep fighting!';
 updateStats();
}
document.getElementById('left').onclick=()=>move(-28);
document.getElementById('right').onclick=()=>move(28);
document.getElementById('attack').onclick=attack;
document.getElementById('restart').onclick=reset;
function drawFighter(x,y,color,size){
 ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(x,y-size*1.7,size*.48,0,Math.PI*2);ctx.fill();
 ctx.fillRect(x-size*.42,y-size*1.3,size*.84,size);
 ctx.fillRect(x-size*.7,y-size*.3,size*.35,size*.8);
 ctx.fillRect(x+size*.35,y-size*.3,size*.35,size*.8);
}
function draw(){
 ctx.clearRect(0,0,700,400);
 let bg=ctx.createLinearGradient(0,0,0,400);
 bg.addColorStop(0,'#171637');bg.addColorStop(1,'#080b18');
 ctx.fillStyle=bg;ctx.fillRect(0,0,700,400);
 for(let i=0;i<45;i++){
 ctx.fillStyle='#5d51a0';
 ctx.fillRect((i*137)%700,(i*67)%280,2,2);
 }
 ctx.fillStyle='#29234b';ctx.fillRect(0,350,700,50);
 ctx.strokeStyle='#6552bd';ctx.beginPath();ctx.moveTo(0,350);ctx.lineTo(700,350);ctx.stroke();
 enemies.forEach(e=>{
 drawFighter(e.x,330,'#8d35b9',19);
 ctx.fillStyle='#ff456c';ctx.fillRect(e.x-18,286,36,4);
 });
 drawFighter(hero.x,330,'#62eaff',23);
 if(attacking>0){
 ctx.strokeStyle='#a9faff';ctx.lineWidth=5;
 ctx.beginPath();ctx.arc(hero.x+20,300,45,-1.1,1.1);ctx.stroke();
 attacking--;
 }
 if(gameOver){
 ctx.fillStyle='#000a';ctx.fillRect(0,0,700,400);
 ctx.fillStyle='#ff7299';ctx.font='bold 42px Arial';
 ctx.textAlign='center';ctx.fillText('HUNTER DEFEATED',350,185);
 ctx.font='20px Arial';ctx.fillText('Tap RESTART to arise again',350,225);
 }
}
function loop(){
 if(!gameOver){
 frame++;
 if(frame%100===0)spawn();
 if(frame%500===0)wave++;
 enemies.forEach(e=>{
 let dx=hero.x-e.x;
 if(Math.abs(dx)>28)e.x+=Math.sign(dx)*0.7;
 else if(++e.attack%45===0)hero.hp-=8;
 });
 if(hero.hp<=0){hero.hp=0;gameOver=true;msg.textContent='Your hunt has ended.'}
 updateStats();
 }
 draw();
 requestAnimationFrame(loop);
}
reset();spawn();loop();
</script>
</body>
</html>
